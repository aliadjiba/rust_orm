[package]
name = "orm"
version = "0.1.0"
edition = "2024"

[lib]
name = "orm"
path = "src/lib.rs"

[dependencies]
actix-web = "4.9.0"
chrono = "0.4.39"
faker_rand = "0.1.1"
futures = "0.3.31"
serde = { version = "1.0.209", features = ["derive"] }
actix-service = "2.0.2"
surrealdb = "2.2.1"
tokio = "1.44.0"
thiserror = "2.0.15"
serde_json = "1.0.143"
jsonwebtoken = { version = "10.2", features = ["rust_crypto"] }
argon2 = "0.5.3"
rand = "0.9.2"
actix-cors = "0.7.1"
erased-serde = "0.4.9"
proc-macro2 = "1.0.106"
quote = "1.0.44"
syn = {version="2.0.114",features=["full"]}
async-trait = "0.1.89"
actix-multipart = "0.7.2"
